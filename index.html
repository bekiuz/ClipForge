<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>ClipForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>CLIPFORGE</b></header><main class="main"><section class="hero"><h1>ClipForge</h1><p>Reels, Shorts va TikTok uchun qisqa video ssenariy yarating.</p></section><section class="panel"><h2>Kontent g‘oyasi</h2><div class="form"><input id="topic" placeholder="Masalan: Ingliz tilini o‘rganish"><select id="platform"><option>Instagram Reels</option><option>YouTube Shorts</option><option>TikTok</option></select><select id="tone"><option>Qiziqarli</option><option>Professional</option><option>Motivatsion</option><option>Ta’limiy</option></select><button onclick="make()">Yaratish</button></div></section><section class="panel"><div class="bar"><h2>Ssenariy</h2><button class="alt" onclick="copy()">Nusxa olish</button></div><div id="out" class="script muted">Mavzu kiriting va ssenariy yarating.</div></section></main><footer class="foot">BEKIUZ · ClipForge · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>let current='';function make(){let t=topic.value.trim();if(!t)return alert('Mavzu kiriting.');let p=platform.value,style=tone.value;current='🎬 '+p+' · '+style+'\\n\\n🎯 HOOK (0–3 soniya)\\n“'+t+' bo‘yicha ko‘pchilik bilmaydigan 3 ta muhim sir!”\\n\\n💡 ASOSIY QISM (3–25 soniya)\\n1. Muammoni qisqa ko‘rsating.\\n2. Bitta aniq va foydali maslahat bering.\\n3. Kichik misol bilan tushuntiring.\\n\\n🚀 YAKUN (25–30 soniya)\\n“Shu maslahatni sinab ko‘ring va natijangizni izohda yozing!”\\n\\n📝 CAPTION\\n'+t+' haqida foydali qisqa tavsiya. Saqlab qo‘ying va do‘stingizga yuboring!\\n\\n#'+t.replace(/[^a-zA-Z0-9\\u0400-\\u04FF]/g,'')+' #foydalimaslahat #uzbekistan\\n\\n📌 Eslatma: bu tahrirlanadigan ssenariy shabloni, real AI generatsiyasi emas.';out.textContent=current;out.classList.remove('muted')}async function copy(){if(!current)return;try{await navigator.clipboard.writeText(current);alert('Ssenariy nusxalandi.')}catch(e){alert('Clipboard uchun HTTPS talab qilinishi mumkin.')}}</script></body></html>
